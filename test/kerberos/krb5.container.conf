# krb5.conf mounted into the metastore container. From inside the compose
# network the KDC is reachable by its service name "kdc".
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    forwardable = true

[realms]
    EXAMPLE.COM = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    localhost = EXAMPLE.COM
